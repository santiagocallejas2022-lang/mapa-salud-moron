<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa de Salud de Morón</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#17372d;background:#eff6f2}header{background:#007c55;color:white;padding:22px;border-bottom:6px solid #d52232}h1{margin:0;font-size:26px}header p{margin:8px 0 0}.filters{display:flex;flex-wrap:wrap;gap:10px;padding:14px;background:white}input,select{font:inherit;padding:10px;border:1px solid #b6c9bf;border-radius:8px;max-width:100%}main{display:grid;grid-template-columns:350px 1fr;height:65vh}#list{overflow:auto;background:white;padding:12px}#map{height:100%;min-height:300px}.item{border:1px solid #dae5df;border-radius:8px;background:white;padding:12px;margin:8px 0;width:100%;text-align:left;cursor:pointer;font:inherit}.item small{display:block;color:#586b62;margin-top:4px}footer{padding:14px;font-size:14px}#status{padding:12px;background:#e0eee6}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}#map{height:48vh;grid-row:1}#list{max-height:45vh}}html{background:#eff8ed}body{background:#eff8ed;color:#234b38}header{background:#cce9c5;color:#204b35;border-bottom:1px solid #a9d4a6;padding:28px clamp(18px,5vw,64px)}header h1{font-size:clamp(25px,3vw,36px);letter-spacing:-.8px}header p{color:#42654c}.filters{background:#f6fbf4;padding:16px clamp(14px,3vw,36px);border-bottom:1px solid #d3e5d0}input,select{background:white;border:1px solid #b7d4b3;border-radius:10px;color:#234b38}input:focus,select:focus{outline:2px solid #75ad71;outline-offset:2px}#status{background:#e0f0dc;color:#31583d;padding:12px 20px}main{gap:12px;padding:12px; height:70vh;grid-template-columns:minmax(270px,330px) 1fr}#list{border:1px solid #d2e6ce;border-radius:14px;background:#f9fcf8}#map{border-radius:14px;border:1px solid #c5dfc0}.item{border:1px solid #d4e7d0;border-radius:10px;color:#234b38;transition:background .15s}.item:hover{background:#e4f3df;border-color:#a9d4a6}.item small{color:#536e59}footer{color:#45654b;background:#eff8ed;padding:14px 20px}@media(max-width:700px){main{grid-template-columns:1fr;height:auto;padding:8px;gap:8px}#map{height:52vh}header{padding:20px 16px}.filters{padding:12px}#search{width:100%}}</style></head><body><header><h1>Mapa de Salud de Morón</h1><p>Centros de atención primaria, hospital y farmacias</p></header><div class="filters"><input id="search" placeholder="Buscar establecimiento" aria-label="Buscar"><select id="local" aria-label="Localidad"><option value="">Todas las localidades</option><option>Morón</option><option>Morón Sur</option><option>Castelar</option><option>Haedo</option><option>El Palomar</option></select><select id="type" aria-label="Tipo"><option value="">Todos los establecimientos</option><option value="C">CAPS</option><option value="H">Hospital</option><option value="F">Farmacias</option></select></div><div id="status">Vista preliminar · 37 establecimientos · ubicaciones pendientes de validación</div><main><section id="list"></section><div id="map"></div></main><footer>🔵 Centros de salud · 🟢 Farmacias. Sin límite de distancia. Las ubicaciones automáticas deben verificarse antes del uso institucional.</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const rows=[["C","Villa Rivadavia","Magnasco 933","Haedo"],["C","Dr. Springolo","Galán 655","El Palomar"],["C","Malvinas Argentinas","Namuncurá 351","El Palomar"],["C","Dr. Winter","Rafael Castillo 151","El Palomar"],["C","Loma Verde","Salvador Curutchet 2550","Castelar"],["C","Dr. Jorge Salinas","Pergamino 1860","Castelar"],["C","Juana Azurduy","Berlín 3870","Castelar"],["C","Gelpi","Onofre Betbeder 3606","Castelar"],["C","René Favaloro","Av. Figueroa Alcorta y Nicolás Granada","Castelar"],["C","Papa Francisco","Los Criollos 300","Morón"],["C","Dr. Monte","Grito de Alcorta 3404","Morón"],["C","Presidente Ibáñez","Avellaneda 2647","Morón Sur"],["C","Azucena Villaflor","Vinara 2237","Morón"],["C","Mercedes Sosa","Av. Eva Perón 3598","Morón"],["H","Hospital Municipal de Morón","Dr. Rodolfo Monte 848","Morón"],["F","DBA / Las Bases","Las Bases 131","Haedo"],["F","De la Estación","Misiones 6378","El Palomar"],["F","De Marconi","Ing. Guillermo Marconi 1986","El Palomar"],["F","Varrella","José Bianco 2591","El Palomar"],["F","La Cantábrica del Oeste","Dr. Ricardo Balbín 733","Morón"],["F","Fiorilli / JR","Salvador Curutchet 2418","Castelar"],["F","Plaza Oeste","Boulevard Juan Manuel de Rosas 701","Castelar"],["F","Bazán","Chivilcoy 2202","Castelar"],["F","Wayar","Berlín 3923","Castelar"],["F","Vargas","Onofre Betbeder 3707","Castelar"],["F","El Lucero","Gervasio Pavón 3999","Castelar"],["F","Roson","Williams Morris 3194","Castelar"],["F","Gasparetto","Blas Parera 2002","Castelar"],["F","Granda","Av. Estanislao Zeballos 2975","Castelar"],["F","Authier","Av. Eva Perón 2698","Morón"],["F","Bideberry-Castellini","Carmen de Patagones 1253","Morón"],["F","Digiambattista","Dr. Félix R. Burgos 981","Morón"],["F","Tagliabue","Presidente Alessandri 896","Morón"],["F","Carlos Casares","Av. Don Bosco 6201","Morón"],["F","Díaz","Av. Eva Perón 3483","Castelar"],["F","Central Oeste Halpern","Córdoba 303","Morón"],["F","Cogliati French","Domingo French 402","Morón"]];const $=id=>document.getElementById(id);const name=r=>(r[0]==='C'?'CAPS ':r[0]==='F'?'Farmacia ':'')+r[1];const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let map,layer;const markers=new Map();if(window.L){map=L.map('map').setView([-34.65,-58.62],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);layer=L.layerGroup().addTo(map)}else{$('map').textContent='No se pudo cargar el mapa. El listado sigue disponible.'}function visible(r){return (!$('type').value||r[0]===$('type').value)&&(!$('local').value||r[3]===$('local').value)&&norm(name(r)+' '+r[2]).includes(norm($('search').value))}function render(){ $('list').replaceChildren();if(layer)layer.clearLayers();let count=0;for(const r of rows){if(!visible(r))continue;count++;const b=document.createElement('button');b.className='item';const strong=document.createElement('strong');strong.textContent=(r[0]==='F'?'🟢 ':'🔵 ')+name(r);const small=document.createElement('small');small.textContent=r[2]+', '+r[3]+(markers.has(r)?' · Ubicación aproximada':' · Ubicación pendiente');b.append(strong,small);$('list').append(b);const m=markers.get(r);if(m&&layer)m.addTo(layer);b.onclick=()=>{if(m){map.setView(m.getLatLng(),16);m.openPopup()}else window.open('https://www.openstreetmap.org/search?query='+encodeURIComponent(r[2]+', '+r[3]+', Buenos Aires, Argentina'),'_blank','noopener')}} $('status').textContent=count+' establecimientos en el listado · '+markers.size+' ubicaciones automáticas de 37 · Vista preliminar';}for(const id of ['search','local','type'])$(id).addEventListener('input',render);render();async function locate(){if(!map)return;for(const r of rows){let p=r[1]==='Presidente Ibáñez'?{lat:-34.67683,lon:-58.61939}:null;if(!p){for(const addr of [r[2],r[2]+', '+r[3]]){try{const res=await fetch('https://apis.datos.gob.ar/georef/api/direcciones?direccion='+encodeURIComponent(addr)+'&provincia=Buenos%20Aires&departamento=Mor%C3%B3n&max=1');if(!res.ok)continue;const j=await res.json();const q=j.direcciones?.[0]?.ubicacion;if(q&&Number.isFinite(q.lat)&&Number.isFinite(q.lon)&&q.lat>-34.75&&q.lat<-34.55&&q.lon>-58.75&&q.lon<-58.5){p=q;break}}catch(e){}}}if(p){const m=L.circleMarker([p.lat,p.lon],{radius:8,color:'#fff',weight:2,fillColor:r[0]==='F'?'#00854b':'#1764bc',fillOpacity:1});const popup=document.createElement('div');popup.textContent=name(r)+' — '+r[2]+', '+r[3]+' (ubicación aproximada)';m.bindPopup(popup);markers.set(r,m);render()}await new Promise(resolve=>setTimeout(resolve,350))}render()}function pendingButton(){const b=document.createElement('button');b.textContent='Copiar establecimientos pendientes';b.style.cssText='padding:10px 16px;border:1px solid #75ad71;border-radius:8px;background:white;color:#204b35;cursor:pointer';b.onclick=async()=>{const pending=rows.filter(r=>!markers.has(r)).map(r=>name(r)+' | '+r[2]+' | '+r[3]).join('\n');try{await navigator.clipboard.writeText(pending);b.textContent='Listado copiado'}catch(e){const t=document.createElement('textarea');t.value=pending;document.body.append(t);t.select();}};document.querySelector('.filters').append(b)}pendingButton();locate();</script></body></html>
